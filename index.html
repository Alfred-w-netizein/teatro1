<!doctype html>
<html lang="pt-BR" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Teatral — A Tropa e o Sertão</title>
  <meta name="description" content="Portal privado de roteiros e personagens da produção teatral A Tropa e o Sertão.">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>

  <div class="app-shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 3v18M4 8l16 8M20 8L4 16" />
          </svg>
        </span>
        <span class="brand__text">
          <strong>Portal Teatral</strong>
          <small>A Tropa e o Sertão</small>
        </span>
      </div>

      <nav class="nav" id="nav">
        <a class="nav__link" href="#/painel" data-route="painel">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
          <span>Visão geral</span>
        </a>
        <a class="nav__link" href="#/personagem" data-route="personagem">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 3.6-6.5 8-6.5S20 17 20 21" />
          </svg>
          <span>Meu personagem</span>
        </a>
        <a class="nav__link" href="#/roteiro" data-route="roteiro">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 4h9l7 7v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" />
            <path d="M13 4v7h7" />
          </svg>
          <span>Roteiro completo</span>
        </a>
        <a class="nav__link" href="#/biblioteca" data-route="biblioteca">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 4h5v16H4zM10 4h5v16h-5z" />
            <path d="m16.5 4.8 3.6 15.2" />
          </svg>
          <span>Biblioteca</span>
        </a>
        <a class="nav__link" href="#/configuracoes" data-route="configuracoes">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 13.7H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" />
          </svg>
          <span>Configurações</span>
        </a>
      </nav>

      <div class="sidebar__foot" id="sidebarFoot"></div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <p class="topbar__title">Portal Teatral</p>
        <button class="icon-btn" id="themeBtn" aria-label="Alternar tema">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
          </svg>
        </button>
      </header>

      <div id="app" class="app" tabindex="-1"></div>
    </main>
  </div>

  <div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>

</html>
